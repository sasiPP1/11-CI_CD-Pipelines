name: IoT Backend CI Pipeline

on:
  # Push ตรงเข้า main (เช่น commit หลังแก้ API ในกิจกรรมที่ 3) ต้องผ่าน lint + test
  # เหมือนกัน ไม่งั้น CD จะ deploy โค้ดที่ยังไม่ผ่านการตรวจ
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Lint and Test Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install Project Dependencies
        run: npm ci
      - name: Run Linter (Code Quality Check)
        run: npm run lint
      - name: Run Unit Tests
        run: npm test
